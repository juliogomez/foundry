# Foundry PoC — bottle (small-repo candidate for Antares localization).
#
# bottle is a single-file WSGI micro-framework (~158 KB Python source,
# ~862 KB total). This repo falls in the <100 KB–500 KB tier of the Antares
# paper's Figure 6 (Section 8.3), where Antares achieves its strongest
# localization performance.
#
# Known vulnerability: CVE-2020-28473 (CWE-444 / CWE-113, HTTP parameter
# cloaking via semicolon splitting in query strings). The vulnerable code
# lives in bottle.py's request-parsing layer.
#
# Purpose: demonstrate that Antares + Foundry localization works well on
# appropriately-sized repos, in contrast to the large-repo results
# (Langflow ~175 MB, MLflow ~112 MB) where Antares could not localize.

system:
  name: "foundry-poc-bottle"

target:
  path: "targets/bottle"
  include_globs:
    - "bottle.py"
  exclude_globs:
    - "**/test*/**"
    - "**/__pycache__/**"
  pinned_ref: "0.12.19"

goals: |
  Evaluate the target for server-side security defects reachable from external
  input: header injection, path traversal, code injection, error-info leakage,
  and unsafe deserialization. In scope: the main bottle.py module (request
  parsing, response headers, static file serving, template rendering, routing).
  Out of scope: tests, plugins, documentation.

llm:
  backend: "cursor"
  model: "claude-sonnet-4-6"
  scratch_cwd: ".scratch"

batching:
  detector_max_units: 25
  detector_max_lines: 1200
  triage_batch_size: 20

budget:
  max_tokens: 2000000
  yield_window: 12
  yield_min_true_positive_rate: 0.05

severity:
  scheme: "low_medium_high_critical"

rules:
  corpus_dir: "rules"

store:
  db_path: "out-bottle/findings.db"
  provenance_log: "out-bottle/provenance.jsonl"
  reports_dir: "out-bottle/findings"
  rule_gaps_log: "out-bottle/rule-gaps.jsonl"
