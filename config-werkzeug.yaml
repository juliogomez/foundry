# Foundry PoC — Werkzeug (small-repo candidate for Antares localization).
#
# Werkzeug is a WSGI utility library (~698 KB Python source, ~1.9 MB total).
# This repo falls in the 0.5–2 MB tier of the Antares paper's Figure 6
# (Section 8.3), where Antares maintains competitive localization performance.
#
# Known vulnerability: CVE-2024-34069 (CWE-94, code execution in debugger).
# The interactive debugger's eval endpoint allows arbitrary code execution
# when evalex is enabled. The vulnerable code lives in
# src/werkzeug/debug/__init__.py (execute_command / frame.eval).
#
# Purpose: demonstrate that Antares + Foundry localization works well on
# appropriately-sized repos, in contrast to the large-repo results
# (Langflow ~175 MB, MLflow ~112 MB) where Antares could not localize.

system:
  name: "foundry-poc-werkzeug"

target:
  path: "targets/werkzeug"
  include_globs:
    - "src/werkzeug/*.py"
    - "src/werkzeug/debug/*.py"
    - "src/werkzeug/sansio/*.py"
    - "src/werkzeug/middleware/*.py"
    - "src/werkzeug/routing/*.py"
  exclude_globs:
    - "**/test*/**"
    - "**/__pycache__/**"
  pinned_ref: "2.3.7"

goals: |
  Evaluate the target for server-side security defects reachable from external
  input: code injection, path traversal, header injection, error-info leakage,
  SSRF, and sensitive-data exposure. In scope: WSGI utilities, request/response
  handling, debugger, routing, middleware. Out of scope: tests, documentation.

llm:
  backend: "cursor"
  model: "claude-sonnet-4-6"
  scratch_cwd: ".scratch"

batching:
  detector_max_units: 25
  detector_max_lines: 1200
  triage_batch_size: 20

budget:
  max_tokens: 2000000
  yield_window: 12
  yield_min_true_positive_rate: 0.05

severity:
  scheme: "low_medium_high_critical"

rules:
  corpus_dir: "rules"

store:
  db_path: "out-werkzeug/findings.db"
  provenance_log: "out-werkzeug/provenance.jsonl"
  reports_dir: "out-werkzeug/findings"
  rule_gaps_log: "out-werkzeug/rule-gaps.jsonl"
