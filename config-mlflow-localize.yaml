# Foundry PoC — MLflow localized run (Antares-scoped).
#
# Use with: python -m foundry_poc.cli --config config-mlflow-localize.yaml localize --cwe CWE-22
#
# include_globs are overridden by the localizer at runtime.

system:
  name: "foundry-poc-mlflow-localized"

target:
  path: "targets/mlflow"
  include_globs:
    - "mlflow/server/*.py"
    - "mlflow/store/artifact/*.py"
  exclude_globs:
    - "**/tests/**"
    - "**/__pycache__/**"
    - "**/db/migrations/**"
    - "**/dbmodels/**"
  pinned_ref: "v2.9.0"

goals: |
  Advisory-driven evaluation: given a specific CWE identified by Antares,
  perform deep governed analysis on the narrowed file scope. Focus on the
  weakness class Antares flagged and related patterns.

llm:
  backend: "cursor"
  model: "claude-sonnet-4-6"
  scratch_cwd: ".scratch"

batching:
  detector_max_units: 25
  detector_max_lines: 1200
  triage_batch_size: 20

budget:
  max_tokens: 2000000
  yield_window: 8
  yield_min_true_positive_rate: 0.05

severity:
  scheme: "low_medium_high_critical"

rules:
  corpus_dir: "rules"

store:
  db_path: "out-mlflow/findings.db"
  provenance_log: "out-mlflow/provenance.jsonl"
  reports_dir: "out-mlflow/findings"
  rule_gaps_log: "out-mlflow/rule-gaps.jsonl"
